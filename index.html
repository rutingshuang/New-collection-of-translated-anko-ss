<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <!-- Core Theme -->
     <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/themes/vue.css" />
    <style>
    :root {
    --dark-base-background: #222;
    --dark-base-color: #bbc0c4;
    --dark-theme-color: var(--theme-color, #42b983);
    --dark-code-color: var(--dark-color);
    --dark-heading-color: var(--dark-theme-color);
    --dark-cover-background: #000000a8;
    --dark-code-background: #303030;
    --dark-tip-background: #2c0000;
    --dark-warn-background: #005842;
    --dark-icon-size: 25px;
    --dark-icon-transition: .1s ease-in-out .1s;
    --dark-moon-color: #000000;
    --dark-sun-color: #ffffff;
}
  </style>
  </head>
  <body class="loading">
    <div id="app">油库里地加载中...</div>

    <!-- Configuration -->
    <script>
      window.$docsify = {
        loadSidebar: true,
        name: true,
        logo: "favicon.ico",
        search : {
          maxAge: 86400000,
          paths: 'auto',
          placeholder: {'/': '搜索'},
          noData: {'/': 'No results!'},
          depth: 2,
        },
      }
    </script>

    <!--Parse HanZi-->

    <script>
      (function () {
        // 等待 Docsify 完成挂载
        window.addEventListener('load', function () {
        // 使用 MutationObserver 监听搜索结果的动态插入
        var observer = new MutationObserver(function (mutations) {
          mutations.forEach(function (mutation) {
            mutation.addedNodes.forEach(function (node) {
              // 找到搜索结果中的标题元素（通常是 a 标签或 h2）
              var titleEl = node.querySelector && node.querySelector('.search-result-title, h2, a');
              if (titleEl) {
                var text = titleEl.textContent || '';
                // 检测是否包含百分号编码
                if (/%[0-9A-Fa-f]{2}/.test(text)) {
                  try {
                    // 解码并替换显示文本
                    titleEl.textContent = decodeURIComponent(text);
                  } catch (e) {
                  // 解码失败则忽略
                  }
                }
              }
            });
          });
        });
        // 监听整个 body 的变化，确保捕获搜索结果的动态插入
        observer.observe(document.body, { childList: true, subtree: true });
      });
    })();
    </script>

    <!-- Docsify.js -->
    <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
    <!-- Plugins (optional) -->
    <script src="search.js"></script>
    <script src="docsify-dark-switcher.js"></script>
  </body>
</html>
